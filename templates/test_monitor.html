<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: white;
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .status-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        .alert-item {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid #dc3545;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease-out;
        }
        .alert-item.high {
            border-color: #dc3545;
            background: rgba(220, 53, 69, 0.3);
        }
        .alert-item.medium {
            border-color: #ffc107;
            background: rgba(255, 193, 7, 0.3);
        }
        .alert-item.low {
            border-color: #17a2b8;
            background: rgba(23, 162, 184, 0.3);
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        .log-entry {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .heartbeat-entry {
            color: #28a745;
        }
        .alert-entry {
            color: #dc3545;
        }
        .traffic-entry {
            color: #17a2b8;
        }
    </style>
</head>
<body>
    <div class="connection-status">
        <span class="badge bg-secondary" id="connectionStatus">Connecting...</span>
    </div>

    <div class="test-container">
        <h1 class="text-center mb-4">
            <i class="fas fa-vial me-2"></i>WebSocket Test Monitor
        </h1>

        <!-- Status Cards -->
        <div class="row">
            <div class="col-md-3">
                <div class="status-card text-center">
                    <h3 id="alertCount">0</h3>
                    <p>Live Alerts</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="status-card text-center">
                    <h3 id="trafficCount">0</h3>
                    <p>Traffic Updates</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="status-card text-center">
                    <h3 id="heartbeatCount">0</h3>
                    <p>Heartbeats</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="status-card text-center">
                    <h3 id="monitoringStatus">Unknown</h3>
                    <p>Monitoring Status</p>
                </div>
            </div>
        </div>

        <!-- Live Alerts -->
        <div class="status-card">
            <h4><i class="fas fa-exclamation-triangle me-2"></i>Live Alerts</h4>
            <div id="alertsList" style="max-height: 300px; overflow-y: auto;">
                <p class="text-muted">Waiting for alerts...</p>
            </div>
        </div>

        <!-- WebSocket Event Log -->
        <div class="status-card">
            <h4><i class="fas fa-terminal me-2"></i>WebSocket Event Log</h4>
            <div id="eventLog" style="max-height: 400px; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px;">
                <div class="log-entry">Starting WebSocket test monitor...</div>
            </div>
        </div>

        <!-- Test Controls -->
        <div class="status-card">
            <h4><i class="fas fa-cogs me-2"></i>Test Controls</h4>
            <button class="btn btn-success me-2" onclick="startMonitoring()">
                <i class="fas fa-play me-1"></i>Start Monitoring
            </button>
            <button class="btn btn-danger me-2" onclick="stopMonitoring()">
                <i class="fas fa-stop me-1"></i>Stop Monitoring
            </button>
            <button class="btn btn-info me-2" onclick="clearLogs()">
                <i class="fas fa-trash me-1"></i>Clear Logs
            </button>
            <button class="btn btn-warning" onclick="testConnection()">
                <i class="fas fa-wifi me-1"></i>Test Connection
            </button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script>
        let socket;
        let alertCount = 0;
        let trafficCount = 0;
        let heartbeatCount = 0;
        let isMonitoring = false;

        // Initialize Socket.IO
        function initSocket() {
            socket = io({
                transports: ['websocket', 'polling'],
                upgrade: true,
                timeout: 30000,
                reconnection: true,
                reconnectionDelay: 1000,
                reconnectionAttempts: 5
            });

            // Connection events
            socket.on('connect', function() {
                logEvent('✅ Connected to WebSocket server', 'success');
                updateConnectionStatus('Connected', 'success');
            });

            socket.on('disconnect', function(reason) {
                logEvent(`❌ Disconnected: ${reason}`, 'danger');
                updateConnectionStatus('Disconnected', 'danger');
            });

            socket.on('connect_error', function(error) {
                logEvent(`🔥 Connection error: ${error.message}`, 'warning');
                updateConnectionStatus('Error', 'warning');
            });

            // Data events
            socket.on('live_alert', function(data) {
                alertCount++;
                document.getElementById('alertCount').textContent = alertCount;
                logEvent(`🚨 Alert: ${data.msg}`, 'alert-entry');
                addAlert(data);
            });

            socket.on('traffic_update', function(data) {
                trafficCount++;
                document.getElementById('trafficCount').textContent = trafficCount;
                logEvent(`📊 Traffic: ${JSON.stringify(data)}`, 'traffic-entry');
            });

            socket.on('monitoring_heartbeat', function(data) {
                heartbeatCount++;
                document.getElementById('heartbeatCount').textContent = heartbeatCount;
                logEvent(`💓 Heartbeat: ${data.updates_sent} updates sent`, 'heartbeat-entry');
            });

            socket.on('monitoring_status', function(data) {
                const status = data.enabled ? 'Running' : 'Stopped';
                document.getElementById('monitoringStatus').textContent = status;
                logEvent(`📡 Status: ${status} (${data.reason || 'manual'})`, 'info');
                isMonitoring = data.enabled;
            });
        }

        function logEvent(message, className = '') {
            const log = document.getElementById('eventLog');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${className}`;
            entry.innerHTML = `[${timestamp}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function addAlert(alert) {
            const alertsList = document.getElementById('alertsList');
            if (alertsList.children.length === 1 && alertsList.children[0].classList.contains('text-muted')) {
                alertsList.innerHTML = '';
            }

            const alertDiv = document.createElement('div');
            alertDiv.className = `alert-item ${alert.level || 'low'}`;
            alertDiv.innerHTML = `
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <strong>${alert.type || 'Alert'}</strong>
                        <p class="mb-1">${alert.msg}</p>
                        <small class="text-muted">${alert.time}</small>
                    </div>
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
            `;
            alertsList.insertBefore(alertDiv, alertsList.firstChild);

            // Keep only last 10 alerts
            while (alertsList.children.length > 10) {
                alertsList.removeChild(alertsList.lastChild);
            }
        }

        function updateConnectionStatus(status, type) {
            const statusElement = document.getElementById('connectionStatus');
            statusElement.textContent = status;
            statusElement.className = `badge bg-${type}`;
        }

        function startMonitoring() {
            fetch('/test-monitor/start', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    logEvent(`🚀 Start monitoring: ${data.message}`, 'success');
                })
                .catch(error => {
                    logEvent(`❌ Start error: ${error.message}`, 'danger');
                });
        }

        function stopMonitoring() {
            fetch('/test-monitor/stop', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    logEvent(`⏹️ Stop monitoring: ${data.message}`, 'warning');
                })
                .catch(error => {
                    logEvent(`❌ Stop error: ${error.message}`, 'danger');
                });
        }

        function clearLogs() {
            document.getElementById('eventLog').innerHTML = '<div class="log-entry">Logs cleared...</div>';
            document.getElementById('alertsList').innerHTML = '<p class="text-muted">Waiting for alerts...</p>';
            alertCount = 0;
            trafficCount = 0;
            heartbeatCount = 0;
            document.getElementById('alertCount').textContent = '0';
            document.getElementById('trafficCount').textContent = '0';
            document.getElementById('heartbeatCount').textContent = '0';
        }

        function testConnection() {
            if (socket && socket.connected) {
                socket.emit('ping', { timestamp: Date.now() });
                logEvent('📡 Ping sent to server', 'info');
            } else {
                logEvent('❌ Not connected to server', 'danger');
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            logEvent('🔧 Initializing WebSocket test monitor...', 'info');
            initSocket();
            
            // Auto-start monitoring after 2 seconds
            setTimeout(() => {
                logEvent('🤖 Auto-starting monitoring...', 'info');
                startMonitoring();
            }, 2000);
        });
    </script>
</body>
</html>
