<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Network Threat Classifier Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Network Threat Classifier</h1>
    <form method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="logfile" class="form-label">Upload Log File (CSV):</label>
            <input class="form-control" type="file" name="logfile" id="logfile" required>
        </div>
        <button class="btn btn-primary" type="submit">Upload & Analyze</button>
        <a href="/download_report" class="btn btn-success ms-2">Download PDF Report</a>
    </form>
    <hr>
    <h2>Live Alerts</h2>
    <ul class="list-group">
        {% for alert in alerts %}
        <li class="list-group-item list-group-item-danger">
            <strong>{{ alert.time }}</strong>: {{ alert.msg }} ({{ alert.level }})
        </li>
        {% endfor %}
    </ul>
    <hr>
    <h2>Threat Trends</h2>
    <table class="table table-striped">
        <thead><tr><th>Time</th><th>Prediction</th></tr></thead>
        <tbody>
        {% for entry in trends %}
        <tr><td>{{ entry.time }}</td><td>{{ entry.prediction }}</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
