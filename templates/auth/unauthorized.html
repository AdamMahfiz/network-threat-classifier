{% extends "base.html" %}

{% block title %}Unauthorized Access{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center"><i class="fas fa-exclamation-triangle me-2"></i>Unauthorized Access</h3>
            </div>
            <div class="card-body text-center">
                <p class="lead">You don't have permission to access this page.</p>
                <p>Please log in with an account that has the required permissions.</p>
                <div class="mt-4">
                    <a href="{{ url_for('auth.login') }}" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt me-2"></i>Login
                    </a>
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary ms-2">
                        <i class="fas fa-home me-2"></i>Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
