services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (32+ chars)}
      DATABASE_URL: postgresql+psycopg2://ntc:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/ntc
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ALLOW_SELF_REGISTRATION: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ntc
      POSTGRES_USER: ntc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ntc -d ntc"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
